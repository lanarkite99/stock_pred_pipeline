networks:
  app_network:
    driver: bridge

services:
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_DB: "${REDIS_DB:-0}"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b-cloud}
      FMI_API_KEY: ${FMI_API_KEY:-}
      DAGSHUB_USER_NAME: ${DAGSHUB_USER_NAME:-}
      DAGSHUB_REPO_NAME: ${DAGSHUB_REPO_NAME:-}
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    depends_on:
      - redis
    networks:
      - app_network
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
      - ./feature_store:/app/feature_store
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - fastapi
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app_network

