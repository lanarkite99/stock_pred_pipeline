name: build-and-push

on:
  workflow_dispatch:
  push:
    branches:
      - cloud_deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push FastAPI image
        run: |
          docker build -t ${{ secrets.ECR_FASTAPI_REPO }}:latest .
          docker push ${{ secrets.ECR_FASTAPI_REPO }}:latest

      - name: Build and push Streamlit image
        run: |
          docker build -t ${{ secrets.ECR_STREAMLIT_REPO }}:latest -f streamlit_app/Dockerfile .
          docker push ${{ secrets.ECR_STREAMLIT_REPO }}:latest
