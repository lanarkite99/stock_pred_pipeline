name: ci

on:
  pull_request:
  push:
    branches:
      - cloud_deploy

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Compile key modules
        run: |
          uv run python -m py_compile backend/main.py
          uv run python -m py_compile src/pipelines/train_pipeline.py
          uv run python -m py_compile src/model/training.py
